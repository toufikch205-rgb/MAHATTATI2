/* Responsive layout: adapt controls and bottom panel to common phone sizes */
html { -webkit-text-size-adjust: 100%; }
button, input { touch-action: manipulation; }
.app { min-height: 0; height: 100vh; height: 100dvh; }
.map-head { top: max(12px, env(safe-area-inset-top)); left: clamp(10px, 3.5vw, 18px); right: clamp(10px, 3.5vw, 18px); gap: 10px; }
.map-location { min-width: 0; max-width: calc(100% - 68px); padding: clamp(9px, 2.5vw, 13px) clamp(10px, 3vw, 15px); gap: 9px; border-radius: 15px; }
.map-location small { font-size: clamp(11px, 3vw, 13px); }
.map-location strong { font-size: clamp(14px, 4vw, 18px); }
.map-location .pin { font-size: clamp(18px, 5vw, 23px); }
.back-arrow { font-size: clamp(21px, 6vw, 27px); }
.map-menu { width: clamp(48px, 14vw, 60px); height: clamp(48px, 14vw, 60px); flex: 0 0 auto; font-size: clamp(27px, 8vw, 35px); }
.bottom-sheet { height: 44dvh; min-height: 270px; max-height: 470px; padding: 7px clamp(12px, 4.2vw, 22px) calc(10px + env(safe-area-inset-bottom)); border-radius: clamp(22px, 6vw, 31px) clamp(22px, 6vw, 31px) 0 0; overscroll-behavior: contain; }
.sheet-handle { height: 14px; }
.sheet-handle span { width: clamp(42px, 15vw, 60px); height: 4px; }
.trip-types { gap: clamp(5px, 2vw, 11px); margin: 4px 0 clamp(10px, 2.8vh, 17px); }
.trip-type { min-width: 0; min-height: clamp(58px, 9.5vh, 76px); padding: 6px 4px; border-radius: 14px; font-size: clamp(12px, 3.6vw, 16px); line-height: 1.3; }
.trip-emoji { font-size: clamp(24px, 7vw, 32px); }
.destination-search { min-height: 54px; height: clamp(54px, 8.5vh, 70px); border-radius: clamp(16px, 4.5vw, 24px); gap: 8px; padding: 0 clamp(12px, 4vw, 20px); font-size: clamp(16px, 5vw, 27px); margin-bottom: clamp(10px, 2.5vh, 16px); }
.search-icon { font-size: clamp(27px, 8vw, 37px); flex: 0 0 auto; }
.promo-card { min-height: clamp(118px, 21vh, 160px); border-radius: 19px; }
.promo-copy { padding: clamp(10px, 3vw, 17px) clamp(9px, 3vw, 15px); }
.promo-copy strong { font-size: clamp(14px, 4.3vw, 19px); line-height: 1.4; }
.promo-copy p { font-size: clamp(11px, 3.2vw, 14px); }
.promo-copy button { padding: 8px clamp(10px, 3vw, 17px); font-size: clamp(12px, 3.5vw, 15px); white-space: nowrap; }
.promo-art { width: 33%; min-width: 88px; font-size: clamp(38px, 12vw, 55px); }
.promo-art span { top: 16px; right: 10px; font-size: clamp(20px, 6vw, 27px); }
.map-controls { bottom: calc(max(44dvh, 270px) + 14px); left: clamp(10px, 3vw, 16px); gap: 8px; }
.map-control { width: clamp(42px, 12vw, 50px); height: clamp(42px, 12vw, 50px); font-size: clamp(19px, 6vw, 24px); }
.map-control.loc { font-size: clamp(23px, 7vw, 29px); }
.toast { bottom: calc(max(44dvh, 270px) + 18px); font-size: clamp(11px, 3vw, 13px); }
.route-fields { padding: clamp(10px, 3vw, 14px); }
.route-field input { font-size: clamp(13px, 3.8vw, 15px); }
.select-map { font-size: clamp(15px, 4.5vw, 18px); }
.primary { height: clamp(43px, 7vh, 49px); font-size: clamp(13px, 3.8vw, 15px); }
@media (max-height: 700px) {
  .bottom-sheet { height: 46dvh; min-height: 250px; padding-top: 6px; }
  .trip-types { margin-bottom: 9px; }
  .trip-type { min-height: 55px; }
  .destination-search { height: 52px; min-height: 52px; margin-bottom: 10px; }
  .promo-card { min-height: 112px; }
  .promo-copy { padding-top: 9px; padding-bottom: 9px; }
  .map-controls { bottom: calc(max(46dvh, 250px) + 12px); }
  .toast { bottom: calc(max(46dvh, 250px) + 16px); }
}
@media (max-width: 360px) {
  .map-location { gap: 6px; padding: 8px 9px; }
  .map-location small { font-size: 10px; }
  .map-location strong { font-size: 13px; }
  .trip-type { font-size: 11px; }
  .destination-search { font-size: 15px; }
  .promo-art { min-width: 78px; }
  .promo-copy strong { font-size: 13px; }
}
@media (min-width: 650px) {
  .app { height: 100dvh; }
  .bottom-sheet { height: 44dvh; min-height: 300px; max-height: 470px; }
  .map-controls { bottom: calc(max(44dvh, 300px) + 14px); }
  .toast { bottom: calc(max(44dvh, 300px) + 18px); }
}

<script>
const $=id=>document.getElementById(id);let lang='ar',mode='car',selecting='pickup',userMarker=null,pickupMarker=null,destMarker=null,accuracyCircle=null,userLatLng=null;
const words={ar:{mapLabel:'من أين',mapDefault:'موقعك الحالي',car:'داخل المدينة',intercity:'بين الولايات',destination:'ما وجهتك وكم التكلفة؟',pickup:'نقطة الانطلاق',pickupPh:'موقعي الحالي',dest:'الوجهة',destPh:'إلى أين تريد الذهاب؟',continue:'متابعة الطلب　↗',mapNote:'موقعك على الخريطة',locating:'جارٍ تحديد موقعك…',located:'تم تحديد موقعك',noLocation:'تعذر تحديد الموقع — تحقق من الإذن',pickPrompt:'اضغط على الخريطة لتحديد نقطة الانطلاق',destPrompt:'اضغط على الخريطة لتحديد الوجهة',needDest:'أدخل الوجهة أو اخترها من الخريطة أولًا.',picked:'تم تحديد نقطة الانطلاق على الخريطة.',destSet:'تم تحديد الوجهة على الخريطة.',demo:'هذه واجهة تجريبية؛ ربط السائقين والطلبات يأتي في المرحلة التالية.',menuDemo:'القائمة والإشعارات ستُضاف في المرحلة التالية.',promoTitle:'سائقونا وسياراتنا موثوقون',promoText:'جميع السائقين والسيارات يتم التحقق منهم',promoMore:'اعرف أكثر',currentLocationOption:'اختيار الموقع الحالي',choosePickupOption:'اختيار نقطة انطلاق',language:'FR'},fr:{mapLabel:'Départ',mapDefault:'Votre position actuelle',car:'Course à prix juste',intercity:'Inter-wilayas',destination:'Où allez-vous et à quel prix ?',pickup:'Point de départ',pickupPh:'Ma position actuelle',dest:'Destination',destPh:'Où souhaitez-vous aller ?',continue:'Continuer　↗',mapNote:'Votre position sur la carte',locating:'Localisation en cours…',located:'Position détectée',noLocation:'Position indisponible — vérifiez l’autorisation',pickPrompt:'Touchez la carte pour choisir le départ',destPrompt:'Touchez la carte pour choisir la destination',needDest:'Saisissez une destination ou choisissez-la sur la carte.',picked:'Point de départ sélectionné.',destSet:'Destination sélectionnée.',demo:'Version de démonstration : la connexion aux chauffeurs viendra ensuite.',menuDemo:'Le menu et les notifications seront ajoutés ensuite.',promoTitle:'Des chauffeurs et véhicules vérifiés',promoText:'Les chauffeurs et les véhicules sont vérifiés',promoMore:'En savoir plus',currentLocationOption:'Choisir ma position actuelle',choosePickupOption:'Choisir un point de départ',language:'ع'}};
function say(k){return words[lang][k]||k}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2800)}
function applyLang(){const w=words[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('mapLabel').textContent=w.mapLabel;$('currentLocationText').textContent=w.currentLocationOption;$('choosePickupText').textContent=w.choosePickupOption;$('carTitle').textContent=w.car;$('intercityTitle').textContent=w.intercity;$('destinationPrompt').textContent=w.destination;$('pickupLabel').textContent=w.pickup;$('destLabel').textContent=w.dest;$('pickupInput').placeholder=w.pickupPh;$('destInput').placeholder=w.destPh;$('continueBtn').textContent=w.continue;$('mapNote').textContent=w.mapNote;$('promoTitle').textContent=w.promoTitle;$('promoText').textContent=w.promoText;$('promoMore').textContent=w.promoMore;if(!userLatLng)$('mapAddress').textContent=w.mapDefault;}
const map=L.map('map',{zoomControl:false,scrollWheelZoom:true}).setView([35.6971,-0.6308],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function divIcon(html,size=[40,40],anchor=[20,20]){return L.divIcon({className:'',html,iconSize:size,iconAnchor:anchor})}
function setUser(latlng,acc=80){
  userLatLng=latlng;
  // The selected pickup is represented by one green marker, avoiding stacked pins.
  const icon=divIcon('<div class="custom-pin green"></div>',[28,28],[14,25]);
  if(pickupMarker) map.removeLayer(pickupMarker);
  pickupMarker=L.marker(latlng,{icon,zIndexOffset:1000,title:say('pickup')}).addTo(map);
  $('pickupInput').value=latlng.lat.toFixed(5)+', '+latlng.lng.toFixed(5);
  if(accuracyCircle) map.removeLayer(accuracyCircle);
  accuracyCircle=L.circle(latlng,{radius:Math.max(acc,25),color:'#B2EC18',weight:1,opacity:.8,fillColor:'#B2EC18',fillOpacity:.14}).addTo(map);
  $('mapAddress').textContent=say('mapDefault');
}
function locate(){
  if (!navigator.geolocation) {
    $('mapAddress').textContent = say('noLocation');
    toast(say('noLocation'));
    return;
  }

  $('mapAddress').textContent = say('locating');

  navigator.geolocation.getCurrentPosition(
    pos => {
      const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
      setUser(ll, pos.coords.accuracy || 80);
      map.setView(ll, 17, { animate: true });
      $('mapAddress').textContent =
        lang === 'ar' ? 'تم تحديد موقعك' : 'Position détectée';
    },
    err => {
      $('mapAddress').textContent = say('noLocation');
      const denied = err && err.code === 1;
      toast(denied
        ? (lang === 'ar'
            ? 'يرجى السماح بالوصول إلى الموقع من إعدادات المتصفح'
            : 'Autorisez la localisation dans les paramètres du navigateur')
        : say('noLocation'));
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}
function setSelectMode(m){selecting=m;$('mapNote').textContent=say(m==='pickup'?'pickPrompt':'destPrompt');toast(say(m==='pickup'?'pickPrompt':'destPrompt'));}
map.on('click',e=>{const ll=e.latlng;const isPickup=selecting==='pickup';const icon=divIcon(`<div class="custom-pin ${isPickup?'green':'red'}"></div>`,[28,28],[14,25]);if(isPickup){if(pickupMarker)map.removeLayer(pickupMarker);pickupMarker=L.marker(ll,{icon}).addTo(map);$('pickupInput').value=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;toast(say('picked'));}else{if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(ll,{icon}).addTo(map);$('destInput').value=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;toast(say('destSet'));}selecting=isPickup?'dest':'pickup';$('mapNote').textContent=say(selecting==='pickup'?'pickPrompt':'destPrompt');});
$('locateBtn').onclick=locate;$('zoomIn').onclick=()=>map.zoomIn();$('pickOnMap').onclick=()=>setSelectMode('pickup');$('destOnMap').onclick=()=>setSelectMode('dest');$('destinationFocus').onclick=()=>{openRouteModal();};
function openRouteModal(){const m=$('routeModal');$('modalPickupInput').value=$('pickupInput').value||$('mapAddress').textContent||'';$('modalDestInput').value=$('destInput').value||'';m.classList.add('open');m.setAttribute('aria-hidden','false');setTimeout(()=>$('modalPickupField').focus({preventScroll:true}),120);}
function closeRouteModal(){const m=$('routeModal');m.classList.remove('open');m.setAttribute('aria-hidden','true');if($('modalPickupMenu'))toggleModalPickupMenu(false);}
$('routeModalClose').onclick=closeRouteModal;
$('routeModal').addEventListener('click',e=>{if(e.target===$('routeModal'))closeRouteModal();});
function toggleModalPickupMenu(force){const menu=$('modalPickupMenu');const field=$('modalPickupField');const open=typeof force==='boolean'?force:!menu.classList.contains('open');menu.classList.toggle('open',open);field.classList.toggle('pickup-active',open);$('modalPickupInput').setAttribute('aria-expanded',String(open));}
$('modalPickupField').addEventListener('click',e=>{e.preventDefault();toggleModalPickupMenu();});
$('modalPickupField').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleModalPickupMenu();}else if(e.key==='Escape'){toggleModalPickupMenu(false);}});
$('modalPickupMenu').addEventListener('click',e=>e.stopPropagation());
$('modalCurrentLocation').onclick=()=>{toggleModalPickupMenu(false);$('mapAddress').textContent=say('locating');if(!navigator.geolocation){toast(say('noLocation'));return;}navigator.geolocation.getCurrentPosition(pos=>{const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);setUser(ll,pos.coords.accuracy||80);map.setView(ll,17,{animate:true});const value=ll.lat.toFixed(5)+', '+ll.lng.toFixed(5);$('pickupInput').value=value;$('modalPickupInput').value=value;$('mapAddress').textContent=lang==='ar'?'تم تحديد موقعك':'Position détectée';toast(say('located'));setTimeout(()=>$('modalDestInput').focus({preventScroll:true}),100);},err=>{const denied=err&&err.code===1;toast(denied?(lang==='ar'?'يرجى السماح بالوصول إلى الموقع من إعدادات المتصفح':'Autorisez la localisation dans les paramètres du navigateur'):say('noLocation'));},{enableHighAccuracy:true,timeout:15000,maximumAge:0});};
$('modalSelectLocation').onclick=()=>{toggleModalPickupMenu(false);closeRouteModal();$('pickupSearchPanel').classList.add('open');$('pickupSearchResults').innerHTML='<div class="pickup-search-status">'+(lang==='ar'?'اكتب اسم المكان أو العنوان للبحث عن نقطة الانطلاق':'Saisissez un lieu ou une adresse')+'</div>';$('pickupSearchInput').value='';setTimeout(()=>$('pickupSearchInput').focus(),80);};
$('modalPickupInput').addEventListener('input',()=>{$('pickupInput').value=$('modalPickupInput').value;});
function openDestinationSearch(){ $('destinationModalSearch').classList.add('open'); $('modalDestField').classList.add('dest-active'); $('destinationSearchInput').value=''; $('destinationSearchResults').innerHTML='<div class="pickup-search-status">اكتب اسم المكان أو العنوان للبحث عن وجهتك</div>'; setTimeout(()=>$('destinationSearchInput').focus({preventScroll:true}),80); }
$('modalDestField').addEventListener('click',e=>{e.preventDefault();openDestinationSearch();});
$('modalDestField').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDestinationSearch();}});
$('destinationSearchBack').onclick=()=>{$('destinationModalSearch').classList.remove('open');$('modalDestField').classList.remove('dest-active');$('modalDestField').focus();};
let destinationSearchTimer;
async function searchDestinationPlaces(){const q=$('destinationSearchInput').value.trim();if(q.length<2){$('destinationSearchResults').innerHTML='<div class="pickup-search-status">اكتب حرفين على الأقل للبحث</div>';return;}$('destinationSearchResults').innerHTML='<div class="pickup-search-status">جارٍ البحث…</div>';try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&addressdetails=1&accept-language='+(lang==='ar'?'ar':'fr')+'&q='+encodeURIComponent(q);const res=await fetch(url,{headers:{'Accept':'application/json'}});if(!res.ok)throw new Error('search');const places=await res.json();const box=$('destinationSearchResults');box.innerHTML='';if(!places.length){box.innerHTML='<div class="pickup-search-status">لم يتم العثور على نتائج</div>';return;}places.forEach(place=>{const b=document.createElement('button');b.type='button';b.className='pickup-search-result';b.textContent=place.display_name;b.onclick=()=>{const ll=L.latLng(Number(place.lat),Number(place.lon));if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(ll,{icon:divIcon('<div class="custom-pin red"></div>',[28,28],[14,25])}).addTo(map);$('destInput').value=place.display_name;$('modalDestInput').value=place.display_name;$('destinationModalSearch').classList.remove('open');$('modalDestField').classList.remove('dest-active');closeRouteModal();showTripMapPage();map.setView(ll,15,{animate:true});if(pickupMarker){const bounds=L.latLngBounds(pickupMarker.getLatLng(),ll).pad(.22);map.fitBounds(bounds,{maxZoom:15,animate:true});}else if(userLatLng){map.fitBounds(L.latLngBounds(userLatLng,ll).pad(.22),{maxZoom:15,animate:true});}toast('تم تحديد الوجهة وعرضها على الخريطة');};box.appendChild(b);});}catch(err){$('destinationSearchResults').innerHTML='<div class="pickup-search-status">تعذر البحث الآن. تحقق من الاتصال وحاول مجددًا.</div>';}}
$('destinationSearchInput').addEventListener('input',()=>{clearTimeout(destinationSearchTimer);destinationSearchTimer=setTimeout(searchDestinationPlaces,450);});$('destinationSearchButton').onclick=searchDestinationPlaces;$('destinationSearchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchDestinationPlaces();}});
function showTripMapPage(){document.body.classList.add('trip-page-active');const page=$('tripMapPage');page.classList.add('open');page.setAttribute('aria-hidden','false');$('tripPagePickup').textContent=$('modalPickupInput').value||$('pickupInput').value||'موقعي الحالي';$('tripPageDestination').textContent=$('modalDestInput').value||$('destInput').value||'الوجهة';setTimeout(()=>{map.invalidateSize();if(pickupMarker&&destMarker){map.fitBounds(L.latLngBounds(pickupMarker.getLatLng(),destMarker.getLatLng()).pad(.22),{maxZoom:15,animate:true});}},100);}
function hideTripMapPage(){const page=$('tripMapPage');page.classList.remove('open');page.setAttribute('aria-hidden','true');document.body.classList.remove('trip-page-active');setTimeout(()=>map.invalidateSize(),80);}
$('tripPageBack').onclick=hideTripMapPage;$('tripPageEdit').onclick=()=>{hideTripMapPage();openRouteModal();};$('tripFareEdit').onclick=()=>toast('يمكنك اقتراح الأجرة المناسبة بعد اختيار الرحلة');$('tripFilters').onclick=()=>toast('خيارات التصفية ستظهر هنا');$('tripSearchOffers').onclick=()=>toast('جارٍ تجهيز عروض الرحلات للمسار المحدد');$('farePlus').onclick=()=>toast('تم اختيار زيادة الأجرة المقترحة');$('fareMinus').onclick=()=>toast('تم اختيار تخفيض الأجرة المقترحة');
$('routeModalSubmit').onclick=()=>{ $('pickupInput').value=$('modalPickupInput').value; $('destInput').value=$('modalDestInput').value; closeRouteModal();document.querySelector('.route-fields').classList.add('open');$('continueBtn').click();};
$('carService').onclick=()=>{mode='car';$('carService').classList.add('active');$('intercityService').classList.remove('active');};$('intercityService').onclick=()=>{mode='intercity';$('intercityService').classList.add('active');$('carService').classList.remove('active');toast(lang==='ar'?'تم اختيار رحلة بين الولايات':'Trajet inter-wilayas sélectionné')};$('continueBtn').onclick=()=>{if(!$('destInput').value.trim()){toast(say('needDest'));$('destInput').focus();return}toast(say('demo'))};function openMenu(){const b=$('menuBackdrop');b.classList.add('open');b.setAttribute('aria-hidden','false');}
function closeMenu(){const b=$('menuBackdrop');b.classList.remove('open');b.setAttribute('aria-hidden','true');}
$('menuBtn').onclick=openMenu;$('menuClose').onclick=closeMenu;
$('menuBackdrop').addEventListener('click',e=>{if(e.target===$('menuBackdrop'))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if($('routeModal').classList.contains('open'))closeRouteModal();}});
$('menuPartner').onclick=()=>toast(lang==='ar'?'وضع الشريك السائق غير متاح بعد':'Le mode chauffeur sera disponible prochainement');
$('menuBackdrop').querySelectorAll('[data-menu-action]').forEach(btn=>btn.addEventListener('click',()=>{
 const action=btn.dataset.menuAction;closeMenu();
 if(action==='city'){ $('carService').click(); }
 else if(action==='intercity'){ $('intercityService').click(); }
 else { toast(lang==='ar'?'سيتم تفعيل هذه الصفحة في مرحلة لاحقة':'Cette page sera activée dans une prochaine étape'); }
}));
function togglePickupOptions(force){
  const menu=$('pickupOptions');
  const badge=$('pickupBadge');
  const open=typeof force==='boolean'?force:!menu.classList.contains('open');
  // Keep the options menu above the map and make its visibility explicit.
  if(open) $('pickupSearchPanel').classList.remove('open');
  menu.classList.toggle('open',open);
  menu.style.setProperty('display', open ? 'block' : 'none', 'important');
  menu.style.setProperty('visibility', open ? 'visible' : 'hidden', 'important');
  menu.style.setProperty('opacity', open ? '1' : '0', 'important');
  menu.style.setProperty('pointer-events', open ? 'auto' : 'none', 'important');
  badge.setAttribute('aria-expanded',String(open));
}
const pickupBadge=$('pickupBadge');
pickupBadge.addEventListener('click',(e)=>{
  e.preventDefault();
  e.stopPropagation();
  togglePickupOptions(!$('pickupOptions').classList.contains('open'));
});
$('pickupOptions').addEventListener('click',e=>e.stopPropagation());
$('pickupSearchPanel').addEventListener('click',e=>e.stopPropagation());
$('currentLocationOption').addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();togglePickupOptions(false);$('pickupSearchPanel').classList.remove('open');document.querySelector('.route-fields').classList.add('open');locate();});
$('choosePickupOption').addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();togglePickupOptions(false);$('pickupSearchPanel').classList.add('open');$('pickupSearchResults').innerHTML='<div class="pickup-search-status">'+(lang==='ar'?'اكتب اسم المكان للبحث عنه':'Saisissez un lieu pour le rechercher')+'</div>';setTimeout(()=>$('pickupSearchInput').focus(),0);});
$('pickupSearchBack').onclick=()=>{$('pickupSearchPanel').classList.remove('open');togglePickupOptions(true);$('pickupBadge').focus();};
let pickupSearchTimer;
async function searchPickupPlaces(){
  clearTimeout(pickupSearchTimer);
  const q=$('pickupSearchInput').value.trim();
  if(q.length<2){$('pickupSearchResults').innerHTML='<div class="pickup-search-status">'+(lang==='ar'?'اكتب حرفين على الأقل للبحث':'Saisissez au moins 2 caractères')+'</div>';return;}
  $('pickupSearchResults').innerHTML='<div class="pickup-search-status">'+(lang==='ar'?'جارٍ البحث…':'Recherche…')+'</div>';
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&addressdetails=1&accept-language='+(lang==='ar'?'ar':'fr')+'&q='+encodeURIComponent(q);
    const res=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!res.ok)throw new Error('search');
    const places=await res.json();
    const box=$('pickupSearchResults');box.innerHTML='';
    if(!places.length){box.innerHTML='<div class="pickup-search-status">'+(lang==='ar'?'لم يتم العثور على نتائج مقترحة':'Aucune suggestion trouvée')+'</div>';return;}
    places.forEach(place=>{
      const b=document.createElement('button');b.type='button';b.className='pickup-search-result';b.textContent=place.display_name;
      b.onclick=()=>{
        const ll=L.latLng(Number(place.lat),Number(place.lon));
        if(pickupMarker)map.removeLayer(pickupMarker);
        const icon=divIcon('<div class="custom-pin green"></div>',[28,28],[14,25]);
        pickupMarker=L.marker(ll,{icon}).addTo(map);
        map.setView(ll,16,{animate:true});
        $('pickupInput').value=place.display_name;
        $('mapAddress').textContent=place.name||place.display_name.split(',')[0];
        $('pickupSearchPanel').classList.remove('open');
        document.querySelector('.route-fields').classList.add('open');
        selecting=null;
        $('modalPickupInput').value=place.display_name;
        $('modalDestInput').value=$('destInput').value||'';
        $('routeModal').classList.add('open');
        $('routeModal').setAttribute('aria-hidden','false');
        setTimeout(()=>$('modalDestInput').focus({preventScroll:true}),120);
        toast(lang==='ar'?'تم اختيار نقطة الانطلاق. أدخل وجهتك الآن':'Point de départ sélectionné. Choisissez la destination.');
      };
      box.appendChild(b);
    });
  }catch(err){$('pickupSearchResults').innerHTML='<div class="pickup-search-status">'+(lang==='ar'?'تعذر البحث الآن. تحقق من الاتصال وحاول مجددًا.':'Recherche indisponible. Vérifiez la connexion et réessayez.')+'</div>';}
}
$('pickupSearchInput').addEventListener('input',()=>{
  clearTimeout(pickupSearchTimer);
  const q=$('pickupSearchInput').value.trim();
  if(q.length<2){$('pickupSearchResults').innerHTML='<div class="pickup-search-status">'+(lang==='ar'?'اكتب اسم المكان للبحث عن اقتراحات':'Saisissez un lieu pour voir des suggestions')+'</div>';return;}
  $('pickupSearchResults').innerHTML='<div class="pickup-search-status">'+(lang==='ar'?'جارٍ اقتراح الأماكن…':'Chargement des suggestions…')+'</div>';
  pickupSearchTimer=setTimeout(searchPickupPlaces,450);
});
$('pickupSearchButton').onclick=searchPickupPlaces;
$('pickupSearchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchPickupPlaces();}});
document.addEventListener('click',e=>{if(!$('pickupOptions').contains(e.target)&&!$('pickupBadge').contains(e.target)&&!$('pickupSearchPanel').contains(e.target))togglePickupOptions(false);});
$('promoMore').onclick=()=>toast(lang==='ar'?'سيتم إضافة تفاصيل التحقق من السائقين لاحقًا':'Les détails de vérification seront ajoutés ensuite');
applyLang();setTimeout(()=>map.invalidateSize(),300);map.whenReady(()=>setTimeout(locate,350));window.addEventListener('resize',()=>map.invalidateSize());
</script>

<script>
// Bind menu controls after the menu elements have been parsed.
(function(){
 const backdrop=document.getElementById('menuBackdrop');
 const backButton=document.getElementById('menuClose');
 const menuButton=document.getElementById('menuBtn');
 if(!backdrop||!backButton)return;
 function returnHome(event){
   if(event){event.preventDefault();event.stopPropagation();}
   backdrop.classList.remove('open');
   backdrop.setAttribute('aria-hidden','true');
   backdrop.style.display='none';
   // Restore the main map/home view without reloading or resetting the trip.
   const mapWrap=document.querySelector('.map-wrap');
   if(mapWrap)mapWrap.style.visibility='visible';
   if(menuButton)menuButton.focus({preventScroll:true});
   setTimeout(()=>{backdrop.style.display='';if(window.map&&typeof window.map.invalidateSize==='function')window.map.invalidateSize();},0);
 }
 backButton.addEventListener('click',returnHome,true);
 backButton.addEventListener('touchend',function(e){e.preventDefault();returnHome(e);},{passive:false,capture:true});
 // Ensure the menu opener and backdrop close action remain functional.
 if(menuButton)menuButton.addEventListener('click',function(){backdrop.style.display='';backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false');});
 backdrop.addEventListener('click',function(e){if(e.target===backdrop)returnHome(e);});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')returnHome(e);});
})();
</script>

<style>
/* Dedicated trip/map page shown after the destination is selected */
#tripMapPage{display:none;position:fixed;inset:0;z-index:1200;pointer-events:none;direction:rtl}
#tripMapPage.open{display:block}
#tripMapPage .trip-top-card{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;pointer-events:auto;background:#fff;border-radius:32px;padding:12px 18px;box-shadow:0 8px 28px #0002;display:grid;gap:4px}
#tripMapPage .trip-location-row{display:flex;align-items:center;gap:14px;min-height:62px;font-size:clamp(17px,4.7vw,27px);font-weight:650}
#tripMapPage .trip-location-row .trip-row-icon{width:36px;flex:0 0 36px;text-align:center;font-size:32px;color:#171717}
#tripMapPage .trip-location-row .trip-row-text{flex:1;min-width:0;overflow-wrap:anywhere}
#tripMapPage .trip-location-row .trip-row-action{font-size:30px;border:0;background:transparent;min-width:42px;color:#111}
#tripMapPage .trip-bottom{position:absolute;left:0;right:0;bottom:0;pointer-events:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#fff;border-radius:32px 32px 0 0;box-shadow:0 -6px 25px #0002}
#tripMapPage .fare-card{border:1px solid #e4e5df;border-radius:32px;padding:14px 13px;background:#f7f7f2;display:flex;align-items:center;gap:12px}
#tripMapPage .fare-info{flex:1;min-width:0;text-align:right}
#tripMapPage .fare-title{font-size:clamp(18px,5vw,27px);font-weight:700;line-height:1.35}
#tripMapPage .fare-meta{font-size:clamp(16px,4.4vw,23px);font-weight:650;line-height:1.5}
#tripMapPage .fare-sub{font-size:clamp(14px,4vw,21px);color:#777}
#tripMapPage .fare-car{font-size:48px;flex:0 0 auto}
#tripMapPage .fare-edit{border:0;border-radius:50%;width:46px;height:46px;background:#f1f1eb;font-size:22px;flex:0 0 auto}
#tripMapPage .suggest-fare{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 5px 5px;font-size:clamp(18px,5vw,26px);font-weight:650;text-align:center}
#tripMapPage .fare-step{border:0;border-radius:50%;width:58px;height:58px;background:#f6f6ee;font-size:32px;color:#aaa;flex:0 0 auto}
#tripMapPage .trip-bottom-actions{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid #eee}
#tripMapPage .trip-filter{border:0;background:transparent;font-size:28px;padding:8px}
#tripMapPage .trip-search-offers{flex:1;border:0;border-radius:22px;background:#b2ec18;min-height:72px;font:750 clamp(20px,5.7vw,30px) system-ui;color:#111}
#tripMapPage .trip-cash{font-size:24px;color:#8ab600}
#tripMapPage .trip-back{position:absolute;top:calc(17px + env(safe-area-inset-top));left:22px;z-index:3;pointer-events:auto;border:0;background:#f1f1eb;border-radius:50%;width:42px;height:42px;font-size:26px}
body.trip-page-active .bottom-sheet{display:none!important}
body.trip-page-active .map-head{display:none!important}
body.trip-page-active .map-controls{bottom:calc(285px + env(safe-area-inset-bottom))!important;left:12px!important}
body.trip-page-active .map-note{display:none!important}
@media(max-height:700px){#tripMapPage .trip-location-row{min-height:49px}#tripMapPage .trip-bottom{padding-top:8px}#tripMapPage .fare-card{padding:9px}#tripMapPage .trip-search-offers{min-height:58px}}
</style>
