<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b10"><title>MAHATTATI — محطتي</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--bg:#08090b;--panel:#1d1d1f;--panel2:#29292b;--lime:#ccff00;--glow:#8ef000;--text:#f5f5f5;--muted:#a6a6a6;--line:rgba(255,255,255,.12);--red:#ff4d5e;--green:#8ef000}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.app{width:100%;height:100dvh;position:relative;overflow:hidden}.map-wrap{position:absolute;inset:0;height:100%;width:100%;overflow:hidden;background:#27333d}#map{height:100%;width:100%;z-index:1}.leaflet-container{background:#26333e}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom{display:none}.map-head{position:absolute;z-index:500;top:calc(18px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.map-location{pointer-events:auto;display:flex;align-items:center;gap:12px;background:rgba(17,17,18,.96);border:1px solid #ffffff12;color:#fff;border-radius:17px;padding:12px 15px;min-width:176px;max-width:70%;box-shadow:0 5px 22px #0004;text-align:right;font-family:inherit}.map-location .pin{font-size:22px;color:var(--lime)}.map-location small{display:block;color:#b7b7b7;font-size:13px}.map-location strong{display:block;font-size:17px;margin-top:2px}.back-arrow{font-size:25px;margin-inline-start:auto}.map-menu{pointer-events:auto;width:60px;height:60px;border:0;border-radius:50%;background:#171719;color:#fff;font-size:34px;line-height:1;box-shadow:0 5px 18px #0005}.map-controls{position:absolute;z-index:500;bottom:36%;left:15px;display:flex;flex-direction:column;gap:9px}.map-control{height:48px;width:48px;border-radius:50%;background:#171719;color:#fff;border:1px solid #ffffff12;font-size:22px;box-shadow:0 4px 12px #0004}.map-control.loc{font-size:27px;color:#fff}.map-note{position:absolute;z-index:450;top:95px;left:14px;background:#101012b8;border:1px solid var(--line);padding:6px 9px;border-radius:9px;color:#eee;font-size:10px;opacity:.0;pointer-events:none}.bottom-sheet{position:absolute;z-index:600;left:0;right:0;bottom:0;height:44.5dvh;min-height:350px;max-height:490px;background:#1d1d1f;border-radius:30px 30px 0 0;padding:8px 20px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -5px 25px #0004;overflow-y:auto}.sheet-handle{height:16px;display:flex;justify-content:center;align-items:flex-start}.sheet-handle span{display:block;width:58px;height:5px;border-radius:9px;background:#5c5c5e}.trip-types{display:flex;gap:10px;margin:6px 0 16px;justify-content:flex-start}.trip-type{flex:1;min-height:70px;border:1px solid transparent;border-radius:16px;background:transparent;color:#fff;font-family:inherit;font-size:15px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px}.trip-type.active{background:#30327d;border-color:#393b8e}.trip-emoji{font-size:30px;line-height:1.1}.destination-search{width:100%;height:68px;border:0;border-radius:24px;background:#303032;color:#fff;display:flex;align-items:center;gap:12px;padding:0 19px;font-family:inherit;font-size:clamp(19px,5.4vw,28px);font-weight:750;text-align:right;margin-bottom:16px}.search-icon{font-size:36px;font-weight:300;line-height:1}.route-fields{display:none;background:#242426;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:13px}.route-fields.open{display:block}.route-row{display:flex;gap:11px;align-items:center;margin:3px 0 10px}.route-symbol{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #8ef00065;flex:none}.route-symbol.dest{background:var(--red);box-shadow:0 0 10px #ff4d5e55}.route-field{flex:1;min-width:0}.route-field label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.route-field input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;font-family:inherit}.route-field input::placeholder{color:#929292}.route-divider{height:1px;background:var(--line);margin:0 22px 11px}.select-map{border:1px solid #8ef00055;color:var(--lime);background:#ccff000b;padding:6px 9px;border-radius:10px;font-size:17px;white-space:nowrap}.primary{margin-top:7px;width:100%;height:47px;border:0;border-radius:13px;background:var(--lime);color:#11160a;font-size:14px;font-weight:900;font-family:inherit}.promo-card{display:flex;min-height:140px;border-radius:23px;background:#263251;overflow:hidden;direction:rtl;margin-top:0}.promo-copy{flex:1;padding:17px 15px;display:flex;flex-direction:column;align-items:flex-start}.promo-copy strong{font-size:18px;line-height:1.45}.promo-copy p{font-size:13px;line-height:1.45;margin:3px 0 10px;color:#f2f2f5}.promo-copy button{margin-top:auto;border:0;border-radius:12px;background:#fff;color:#111;padding:10px 17px;font-family:inherit;font-size:14px}.promo-art{position:relative;width:34%;min-width:105px;display:grid;place-items:center;background:linear-gradient(145deg,#eef0f2 0 45%,#2855e6 45% 100%);font-size:52px}.promo-art span{position:absolute;color:#a6e900;font-weight:900;font-size:25px;top:23px;right:15px;text-shadow:0 1px 4px #333}.toast{position:fixed;z-index:2000;bottom:calc(45dvh + 20px);left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:.25s;background:#242428;border:1px solid var(--line);padding:11px 15px;border-radius:13px;font-size:12px;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.custom-user{width:44px;height:44px;border-radius:15px;background:#fff;border:3px solid #151515;box-shadow:0 0 0 3px #fff,0 2px 15px #0007;display:grid;place-items:center;font-size:25px}.custom-pin{width:25px;height:25px;border:3px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 8px #0006}.custom-pin.green{background:#8ef000}.custom-pin.red{background:#ff4d5e}@media(min-width:650px){.app{max-width:480px;margin:0 auto;border-left:1px solid #252525;border-right:1px solid #252525}.map-wrap{width:100%}.bottom-sheet{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:480px}.map-head{left:max(16px,calc((100vw - 480px)/2 + 16px));right:max(16px,calc((100vw - 480px)/2 + 16px))}.map-controls{left:max(15px,calc((100vw - 480px)/2 + 15px))}}

/* Responsive layout: adapt controls and bottom panel to common phone sizes */
html { -webkit-text-size-adjust: 100%; }
button, input { touch-action: manipulation; }
.app { min-height: 0; height: 100vh; height: 100dvh; }
.map-head { top: max(12px, env(safe-area-inset-top)); left: clamp(10px, 3.5vw, 18px); right: clamp(10px, 3.5vw, 18px); gap: 10px; }
.map-location { min-width: 0; max-width: calc(100% - 68px); padding: clamp(9px, 2.5vw, 13px) clamp(10px, 3vw, 15px); gap: 9px; border-radius: 15px; }
.map-location small { font-size: clamp(11px, 3vw, 13px); }
.map-location strong { font-size: clamp(14px, 4vw, 18px); }
.map-location .pin { font-size: clamp(18px, 5vw, 23px); }
.back-arrow { font-size: clamp(21px, 6vw, 27px); }
.map-menu { width: clamp(48px, 14vw, 60px); height: clamp(48px, 14vw, 60px); flex: 0 0 auto; font-size: clamp(27px, 8vw, 35px); }
.bottom-sheet { height: 44dvh; min-height: 270px; max-height: 470px; padding: 7px clamp(12px, 4.2vw, 22px) calc(10px + env(safe-area-inset-bottom)); border-radius: clamp(22px, 6vw, 31px) clamp(22px, 6vw, 31px) 0 0; overscroll-behavior: contain; }
.sheet-handle { height: 14px; }
.sheet-handle span { width: clamp(42px, 15vw, 60px); height: 4px; }
.trip-types { gap: clamp(5px, 2vw, 11px); margin: 4px 0 clamp(10px, 2.8vh, 17px); }
.trip-type { min-width: 0; min-height: clamp(58px, 9.5vh, 76px); padding: 6px 4px; border-radius: 14px; font-size: clamp(12px, 3.6vw, 16px); line-height: 1.3; }
.trip-emoji { font-size: clamp(24px, 7vw, 32px); }
.destination-search { min-height: 54px; height: clamp(54px, 8.5vh, 70px); border-radius: clamp(16px, 4.5vw, 24px); gap: 8px; padding: 0 clamp(12px, 4vw, 20px); font-size: clamp(16px, 5vw, 27px); margin-bottom: clamp(10px, 2.5vh, 16px); }
.search-icon { font-size: clamp(27px, 8vw, 37px); flex: 0 0 auto; }
.promo-card { min-height: clamp(118px, 21vh, 160px); border-radius: 19px; }
.promo-copy { padding: clamp(10px, 3vw, 17px) clamp(9px, 3vw, 15px); }
.promo-copy strong { font-size: clamp(14px, 4.3vw, 19px); line-height: 1.4; }
.promo-copy p { font-size: clamp(11px, 3.2vw, 14px); }
.promo-copy button { padding: 8px clamp(10px, 3vw, 17px); font-size: clamp(12px, 3.5vw, 15px); white-space: nowrap; }
.promo-art { width: 33%; min-width: 88px; font-size: clamp(38px, 12vw, 55px); }
.promo-art span { top: 16px; right: 10px; font-size: clamp(20px, 6vw, 27px); }
.map-controls { bottom: calc(max(44dvh, 270px) + 14px); left: clamp(10px, 3vw, 16px); gap: 8px; }
.map-control { width: clamp(42px, 12vw, 50px); height: clamp(42px, 12vw, 50px); font-size: clamp(19px, 6vw, 24px); }
.map-control.loc { font-size: clamp(23px, 7vw, 29px); }
.toast { bottom: calc(max(44dvh, 270px) + 18px); font-size: clamp(11px, 3vw, 13px); }
.route-fields { padding: clamp(10px, 3vw, 14px); }
.route-field input { font-size: clamp(13px, 3.8vw, 15px); }
.select-map { font-size: clamp(15px, 4.5vw, 18px); }
.primary { height: clamp(43px, 7vh, 49px); font-size: clamp(13px, 3.8vw, 15px); }
@media (max-height: 700px) {
  .bottom-sheet { height: 46dvh; min-height: 250px; padding-top: 6px; }
  .trip-types { margin-bottom: 9px; }
  .trip-type { min-height: 55px; }
  .destination-search { height: 52px; min-height: 52px; margin-bottom: 10px; }
  .promo-card { min-height: 112px; }
  .promo-copy { padding-top: 9px; padding-bottom: 9px; }
  .map-controls { bottom: calc(max(46dvh, 250px) + 12px); }
  .toast { bottom: calc(max(46dvh, 250px) + 16px); }
}
@media (max-width: 360px) {
  .map-location { gap: 6px; padding: 8px 9px; }
  .map-location small { font-size: 10px; }
  .map-location strong { font-size: 13px; }
  .trip-type { font-size: 11px; }
  .destination-search { font-size: 15px; }
  .promo-art { min-width: 78px; }
  .promo-copy strong { font-size: 13px; }
}
@media (min-width: 650px) {
  .app { height: 100dvh; }
  .bottom-sheet { height: 44dvh; min-height: 300px; max-height: 470px; }
  .map-controls { bottom: calc(max(44dvh, 300px) + 14px); }
  .toast { bottom: calc(max(44dvh, 300px) + 18px); }
}
</style>
</head>
<body>
<div class="app">
  <section class="map-wrap" aria-label="خريطة الموقع"><div id="map"></div>
    <div class="map-head"><button class="map-location" id="pickupBadge"><span class="pin">⌖</span><span><small id="mapLabel">من أين</small><strong id="mapAddress">موقعك الحالي</strong></span><b class="back-arrow">‹</b></button><button class="map-menu" id="menuBtn" aria-label="القائمة">☰</button></div>
    <div class="map-controls"><button class="map-control loc" id="locateBtn" aria-label="موقعي">➤</button><button class="map-control" id="zoomIn" aria-label="تكبير">＋</button></div>
    <div class="map-note" id="mapNote">موقعك على الخريطة</div>
  </section>
  <section class="bottom-sheet">
    <div class="sheet-handle"><span></span></div>
    <div class="trip-types">
      <button class="trip-type active" id="carService"><span class="trip-emoji">🚘</span><span id="carTitle">رحلة بسعر عادل</span></button>
      <button class="trip-type" id="intercityService"><span class="trip-emoji">🧳🚘</span><span id="intercityTitle">بين الولايات</span></button>
    </div>
    <button class="destination-search" id="destinationFocus"><span class="search-icon">⌕</span><span id="destinationPrompt">ما وجهتك وكم التكلفة؟</span></button>
    <div class="route-fields">
      <div class="route-row"><span class="route-symbol"></span><div class="route-field"><label id="pickupLabel">نقطة الانطلاق</label><input id="pickupInput" placeholder="موقعي الحالي" autocomplete="street-address"></div><button class="select-map" id="pickOnMap" aria-label="اختر الانطلاق على الخريطة">⌖</button></div>
      <div class="route-divider"></div>
      <div class="route-row"><span class="route-symbol dest"></span><div class="route-field"><label id="destLabel">الوجهة</label><input id="destInput" placeholder="إلى أين تريد الذهاب؟" autocomplete="street-address"></div><button class="select-map" id="destOnMap" aria-label="اختر الوجهة على الخريطة">⌖</button></div>
      <button class="primary" id="continueBtn">متابعة الطلب　↗</button>
    </div>
    <div class="promo-card"><div class="promo-copy"><strong id="promoTitle">سائقونا وسياراتنا موثوقون</strong><p id="promoText">جميع السائقين والسيارات يتم التحقق منهم</p><button id="promoMore">اعرف أكثر</button></div><div class="promo-art">🚘<span>✓</span></div></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $=id=>document.getElementById(id);let lang='ar',mode='car',selecting='pickup',userMarker=null,pickupMarker=null,destMarker=null,accuracyCircle=null,userLatLng=null;
const words={ar:{mapLabel:'من أين',mapDefault:'موقعك الحالي',car:'رحلة بسعر عادل',intercity:'بين الولايات',destination:'ما وجهتك وكم التكلفة؟',pickup:'نقطة الانطلاق',pickupPh:'موقعي الحالي',dest:'الوجهة',destPh:'إلى أين تريد الذهاب؟',continue:'متابعة الطلب　↗',mapNote:'موقعك على الخريطة',locating:'جارٍ تحديد موقعك…',located:'تم تحديد موقعك',noLocation:'تعذر تحديد الموقع — تحقق من الإذن',pickPrompt:'اضغط على الخريطة لتحديد نقطة الانطلاق',destPrompt:'اضغط على الخريطة لتحديد الوجهة',needDest:'أدخل الوجهة أو اخترها من الخريطة أولًا.',picked:'تم تحديد نقطة الانطلاق على الخريطة.',destSet:'تم تحديد الوجهة على الخريطة.',demo:'هذه واجهة تجريبية؛ ربط السائقين والطلبات يأتي في المرحلة التالية.',menuDemo:'القائمة والإشعارات ستُضاف في المرحلة التالية.',promoTitle:'سائقونا وسياراتنا موثوقون',promoText:'جميع السائقين والسيارات يتم التحقق منهم',promoMore:'اعرف أكثر',language:'FR'},fr:{mapLabel:'Départ',mapDefault:'Votre position actuelle',car:'Course à prix juste',intercity:'Inter-wilayas',destination:'Où allez-vous et à quel prix ?',pickup:'Point de départ',pickupPh:'Ma position actuelle',dest:'Destination',destPh:'Où souhaitez-vous aller ?',continue:'Continuer　↗',mapNote:'Votre position sur la carte',locating:'Localisation en cours…',located:'Position détectée',noLocation:'Position indisponible — vérifiez l’autorisation',pickPrompt:'Touchez la carte pour choisir le départ',destPrompt:'Touchez la carte pour choisir la destination',needDest:'Saisissez une destination ou choisissez-la sur la carte.',picked:'Point de départ sélectionné.',destSet:'Destination sélectionnée.',demo:'Version de démonstration : la connexion aux chauffeurs viendra ensuite.',menuDemo:'Le menu et les notifications seront ajoutés ensuite.',promoTitle:'Des chauffeurs et véhicules vérifiés',promoText:'Les chauffeurs et les véhicules sont vérifiés',promoMore:'En savoir plus',language:'ع'}};
function say(k){return words[lang][k]||k}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2800)}
function applyLang(){const w=words[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('mapLabel').textContent=w.mapLabel;$('carTitle').textContent=w.car;$('intercityTitle').textContent=w.intercity;$('destinationPrompt').textContent=w.destination;$('pickupLabel').textContent=w.pickup;$('destLabel').textContent=w.dest;$('pickupInput').placeholder=w.pickupPh;$('destInput').placeholder=w.destPh;$('continueBtn').textContent=w.continue;$('mapNote').textContent=w.mapNote;$('promoTitle').textContent=w.promoTitle;$('promoText').textContent=w.promoText;$('promoMore').textContent=w.promoMore;if(!userLatLng)$('mapAddress').textContent=w.mapDefault;}
const map=L.map('map',{zoomControl:false,scrollWheelZoom:true}).setView([35.6971,-0.6308],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function divIcon(html,size=[40,40],anchor=[20,20]){return L.divIcon({className:'',html,iconSize:size,iconAnchor:anchor})}
function setUser(latlng,acc=80){userLatLng=latlng;const icon=divIcon('<div class="custom-user"><span>🙋🏻</span></div>',[46,46],[23,23]);if(!userMarker)userMarker=L.marker(latlng,{icon,zIndexOffset:900}).addTo(map);else userMarker.setLatLng(latlng).setIcon(icon);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle(latlng,{radius:Math.max(acc,25),color:'#7dd3fc',weight:1,opacity:.8,fillColor:'#7dd3fc',fillOpacity:.18}).addTo(map);$('mapAddress').textContent=say('mapDefault');$('locationStatus')?.textContent; if(!$('pickupInput').value)$('pickupInput').value=say('mapDefault');}
function locate(){if(!navigator.geolocation){toast(say('noLocation'));return}$('mapAddress').textContent=say('locating');navigator.geolocation.getCurrentPosition(pos=>{const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);setUser(ll,pos.coords.accuracy||80);map.setView(ll,17,{animate:true});},()=>{$('mapAddress').textContent=say('noLocation');toast(say('noLocation'));},{enableHighAccuracy:true,timeout:12000,maximumAge:10000});}
function setSelectMode(m){selecting=m;$('mapNote').textContent=say(m==='pickup'?'pickPrompt':'destPrompt');toast(say(m==='pickup'?'pickPrompt':'destPrompt'));}
map.on('click',e=>{const ll=e.latlng;const isPickup=selecting==='pickup';const icon=divIcon(`<div class="custom-pin ${isPickup?'green':'red'}"></div>`,[28,28],[14,25]);if(isPickup){if(pickupMarker)map.removeLayer(pickupMarker);pickupMarker=L.marker(ll,{icon}).addTo(map);$('pickupInput').value=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;toast(say('picked'));}else{if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(ll,{icon}).addTo(map);$('destInput').value=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;toast(say('destSet'));}selecting=isPickup?'dest':'pickup';$('mapNote').textContent=say(selecting==='pickup'?'pickPrompt':'destPrompt');});
$('locateBtn').onclick=locate;$('zoomIn').onclick=()=>map.zoomIn();$('pickOnMap').onclick=()=>setSelectMode('pickup');$('destOnMap').onclick=()=>setSelectMode('dest');$('destinationFocus').onclick=()=>{$('destInput').focus();document.querySelector('.route-fields').classList.add('open');};$('carService').onclick=()=>{mode='car';$('carService').classList.add('active');$('intercityService').classList.remove('active');};$('intercityService').onclick=()=>{mode='intercity';$('intercityService').classList.add('active');$('carService').classList.remove('active');toast(lang==='ar'?'تم اختيار رحلة بين الولايات':'Trajet inter-wilayas sélectionné')};$('continueBtn').onclick=()=>{if(!$('destInput').value.trim()){toast(say('needDest'));$('destInput').focus();return}toast(say('demo'))};$('menuBtn').onclick=()=>toast(say('menuDemo'));$('pickupBadge').onclick=()=>setSelectMode('pickup');$('promoMore').onclick=()=>toast(lang==='ar'?'سيتم إضافة تفاصيل التحقق من السائقين لاحقًا':'Les détails de vérification seront ajoutés ensuite');
applyLang();setTimeout(()=>map.invalidateSize(),300);locate();window.addEventListener('resize',()=>map.invalidateSize());
</script>
</body></html>
